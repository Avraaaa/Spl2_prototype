name: datasoft-service-portal
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [private]
  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: .env
    volumes:
      - ./services/api:/workspace/services/api
    command: ["uv", "run", "--no-sync", "--package", "datasoft-api", "python", "services/api/manage.py", "runserver", "0.0.0.0:8000"]
    ports: ["127.0.0.1:${API_PUBLISHED_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
    networks: [private, webnet]
  worker:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: .env
    volumes:
      - ./services/api:/workspace/services/api
    command: ["uv", "run", "--no-sync", "--package", "datasoft-api", "python", "services/api/manage.py", "run_outbox_worker"]
    depends_on: {db: {condition: service_healthy}}
    networks: [private]
    profiles: [later-worker]
  ml:
    build: {context: ., dockerfile: services/ml/Dockerfile}
    environment:
      ML_MODEL_ENABLED: ${ML_MODEL_ENABLED:-0}
      ML_MODEL_PATH: /models/multilingual-e5-small
      ML_SHARED_TOKEN: ${ML_SHARED_TOKEN:?required}
    volumes:
      - ./services/ml:/workspace/services/ml
      - ./models:/models:ro
    ports: ["127.0.0.1:${ML_PUBLISHED_PORT:-8001}:8001"]
    networks: [private]
  web:
    environment: {VITE_API_PROXY_TARGET: "http://api:8000"}
    build: {context: ./apps/web, dockerfile: Dockerfile}
    volumes:
      - ./apps/web:/app
      - node_modules:/app/node_modules
    ports: ["127.0.0.1:${WEB_PUBLISHED_PORT:-5173}:5173"]
    depends_on: [api]
    networks: [webnet]
volumes:
  dbdata: {}
  node_modules: {}
networks:
  private: {internal: true}
  webnet: {}
