openapi: 3.0.3
info:
  title: DataSoft Service Request API
  version: 0.1.0
paths:
  /api/admin/organizations/:
    get:
      operationId: admin_organizations_list
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
    post:
      operationId: admin_organizations_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      parameters:
      - in: query
        name: organization
        schema:
          type: integer
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalUser'
          description: ''
    post:
      operationId: admin_users_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryCredential'
          description: ''
  /api/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/admin/users/{id}/deactivate/:
    post:
      operationId: admin_users_deactivate_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/admin/users/{id}/reset-password/:
    post:
      operationId: admin_users_reset_password_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryCredential'
          description: ''
  /api/admin/users/{id}/roles/:
    put:
      operationId: admin_users_roles_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RolesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RolesRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/change-username/:
    post:
      operationId: auth_change_username_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Idempotent: anonymous callers get 204. SessionAuthentication still enforces CSRF for
        authenticated sessions, so a 403 here always means the session is still active.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Unauthenticated liveness probe. Intentionally in the contract so the generated
        TypeScript client can verify frontend-to-Django connectivity; exposes no data.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - current_password
      - new_password
    ChangeUsernameRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]{3,150}$
        current_password:
          type: string
          minLength: 1
      required:
      - current_password
      - username
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        stage:
          type: string
      required:
      - service
      - stage
      - status
    KindEnum:
      enum:
      - DATASOFT
      - BANK
      type: string
      description: |-
        * `DATASOFT` - DataSoft
        * `BANK` - Client bank
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    Organization:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 20
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - is_active
      - kind
      - name
    OrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - code
      - name
    OrganizationSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 20
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - code
      - id
      - kind
      - name
    PatchedProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
    PortalUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        must_change_password:
          type: boolean
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - last_login
      - must_change_password
      - organization
      - roles
      - username
    RolesEnum:
      enum:
      - ISSUE_OFFICER
      - ISSUE_VERIFIER
      - DATASOFT_ADMIN
      - SUPPORT_AGENT
      type: string
      description: |-
        * `ISSUE_OFFICER` - Client Issue Officer
        * `ISSUE_VERIFIER` - Client Issue Verifier
        * `DATASOFT_ADMIN` - DataSoft Administrator
        * `SUPPORT_AGENT` - DataSoft Support Agent
    RolesRequest:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesEnum'
      required:
      - roles
    TemporaryCredential:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/PortalUser'
        temporary_password:
          type: string
          description: Shown once. Never logged or stored in plaintext.
      required:
      - temporary_password
      - user
    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]{3,150}$
        email:
          type: string
          format: email
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        organization:
          type: integer
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesEnum'
      required:
      - email
      - full_name
      - organization
      - roles
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
