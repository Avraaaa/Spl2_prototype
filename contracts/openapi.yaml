openapi: 3.0.3
info:
  title: DataSoft Service Request API
  version: 0.1.0
paths:
  /api/admin/organizations/:
    get:
      operationId: admin_organizations_list
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
    post:
      operationId: admin_organizations_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/admin/organizations/{id}/contact-email/:
    patch:
      operationId: admin_organizations_contact_email_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this organization.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/admin/products/:
    post:
      operationId: admin_products_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/admin/products/{product_id}/:
    patch:
      operationId: admin_products_update_color
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductColorWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductColorWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductColorWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/admin/products/{product_id}/modules/:
    post:
      operationId: admin_products_modules_create
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModuleWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModuleWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
          description: ''
  /api/admin/response-due-periods/:
    get:
      operationId: admin_response_due_periods_retrieve
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDuePeriods'
          description: ''
    put:
      operationId: admin_response_due_periods_update
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseDuePeriodsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResponseDuePeriodsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResponseDuePeriodsRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDuePeriods'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      parameters:
      - in: query
        name: organization
        schema:
          type: integer
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalUser'
          description: ''
    post:
      operationId: admin_users_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryCredential'
          description: ''
  /api/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/admin/users/{id}/deactivate/:
    post:
      operationId: admin_users_deactivate_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/admin/users/{id}/reset-password/:
    post:
      operationId: admin_users_reset_password_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryCredential'
          description: ''
  /api/admin/users/{id}/roles/:
    put:
      operationId: admin_users_roles_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RolesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RolesRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/attachments/{id}/download/:
    get:
      operationId: attachments_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - attachments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/audit/anchor/:
    post:
      operationId: audit_anchor_create
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorResponse'
          description: ''
  /api/audit/records/:
    get:
      operationId: audit_records_retrieve
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: after
        schema:
          type: string
        description: Inclusive ISO date
      - in: query
        name: before
        schema:
          type: string
        description: Inclusive ISO date
      - in: query
        name: organization
        schema:
          type: string
        description: Bank organization code
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
          description: ''
  /api/audit/records/{id}/:
    get:
      operationId: audit_record_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecord'
          description: ''
  /api/audit/records/export/:
    get:
      operationId: audit_records_export_retrieve
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: after
        schema:
          type: string
      - in: query
        name: before
        schema:
          type: string
      - in: query
        name: organization
        schema:
          type: string
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/audit/verify/:
    get:
      operationId: audit_verify_retrieve
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/change-username/:
    post:
      operationId: auth_change_username_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Idempotent: anonymous callers get 204. SessionAuthentication still enforces CSRF for
        authenticated sessions, so a 403 here always means the session is still active.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/deployed-versions/:
    get:
      operationId: deployed_versions_list
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeployedVersion'
          description: ''
    post:
      operationId: deployed_versions_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployedVersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeployedVersionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeployedVersionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployedVersion'
          description: ''
  /api/display-colors/:
    get:
      operationId: display_colors_list
      tags:
      - display-colors
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayColorsResponse'
          description: ''
  /api/display-colors/{kind}/{key}/:
    put:
      operationId: display_color_update
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - display-colors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColorWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColorWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColorWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayColorsResponse'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Unauthenticated liveness probe. Intentionally in the contract so the generated
        TypeScript client can verify frontend-to-Django connectivity; exposes no data.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/issues/:
    get:
      operationId: issues_list
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
      - in: query
        name: label
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: organization
        schema:
          type: integer
      - in: query
        name: overdue
        schema:
          type: boolean
      - in: query
        name: priority
        schema:
          type: string
      - in: query
        name: request_type
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - issues
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
          description: ''
    post:
      operationId: issues_create
      tags:
      - issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/issues/{id}/:
    get:
      operationId: issues_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - issues
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    patch:
      operationId: issues_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIssueDraftEditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIssueDraftEditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIssueDraftEditRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    delete:
      operationId: issues_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - issues
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/issues/{id}/accept/:
    post:
      operationId: issues_accept_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/issues/{id}/assign/:
    post:
      operationId: issues_assign_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/issues/{id}/attachments/:
    get:
      operationId: issues_attachments_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - attachments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
          description: ''
    post:
      operationId: issues_attachments_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/issues/{id}/close/:
    post:
      operationId: issues_close_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionVersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransitionVersionRequest'
