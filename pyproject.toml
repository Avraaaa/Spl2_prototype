[project]
name = "datasoft-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/ml"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5", "pytest-cov>=6,<8", "httpx>=0.27,<0.30", "ruff>=0.14,<0.20", "mypy>=1.15,<3", "django-stubs>=5.2,<7", "pre-commit>=4,<6"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["services/api", "services/ml"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
mypy_path = "services/api"
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["services/api", "services/ml"]
addopts = "--strict-markers"
